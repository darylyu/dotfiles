# ~/.config/environment.d/ssh-agent.conf
# Use the OpenSSH agent from openssh-agent.service in every session. Sway (Wayland)
# logins skip the X session script that starts ssh-agent for i3, so without this sway
# has no agent. With it, i3 uses the same agent.

SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
