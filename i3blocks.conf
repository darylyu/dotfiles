# i3blocks config, used by the i3 bar. See `man i3blocks`.
# The block scripts come from i3blocks-contrib, cloned into ~/.config/i3blocks by quickstart.sh.
# Debian's i3blocks 1.4 has no custom settings, so script options go on the command line.
# Colors are gruvbox dark, to match i3_config.

command=$HOME/.config/i3blocks/$BLOCK_NAME/$BLOCK_NAME
separator_block_width=15
markup=none
color=#ebdbb2

[volume]
label=vol
interval=once
signal=10

# IBus input method. Click or $mod+i to switch.
[lang]
command=[ "$BLOCK_BUTTON" = 1 ] && ~/.config/i3/lang.sh toggle; ~/.config/i3/lang.sh
interval=5
signal=11

# Left-click: small calendar (gsimplecal). Right-click: GNOME Calendar.
[time]
command=case "$BLOCK_BUTTON" in 1) gsimplecal >/dev/null 2>&1 & ;; 3) gnome-calendar >/dev/null 2>&1 & ;; esac; date '+%Y-%m-%d %H:%M'
interval=5
