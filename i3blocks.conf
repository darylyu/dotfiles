# i3blocks config, used by the i3 bar. See `man i3blocks`.
# The block scripts come from i3blocks-contrib, cloned into ~/.config/i3blocks by quickstart.sh.
# Debian's i3blocks 1.4 has no custom settings, so script options go on the command line.
# Labels are Nerd Font icons. Colors are gruvbox dark, to match i3_config.

command=$HOME/.config/i3blocks/$BLOCK_NAME/$BLOCK_NAME
separator_block_width=15
markup=none
color=#ebdbb2

[volume]
label=󰕾
interval=once
signal=10

[wifi]
label=󰖩
instance=wlp61s0
command=PATH=$PATH:/usr/sbin COLOR_GE80=#ebdbb2 COLOR_GE60=#ebdbb2 COLOR_GE40=#fabd2f COLOR_LOWR=#fb4934 COLOR_DOWN=#fb4934 $HOME/.config/i3blocks/wifi/wifi
interval=10

[time]
label=󰥔
command=date '+%Y-%m-%d %H:%M'
interval=5
