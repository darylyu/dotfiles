# kitty terminal, used by i3. Colors are gruvbox dark, to match i3_config.
# See https://sw.kovidgoyal.net/kitty/conf/

font_family FiraMono Nerd Font Mono
font_size 12.0

window_padding_width 6
confirm_os_window_close 0
enable_audio_bell no

# Gruvbox dark
foreground #ebdbb2
background #282828
cursor #ebdbb2
cursor_text_color #282828
selection_foreground #282828
selection_background #d65d0e
url_color #83a598

# black
color0 #282828
color8 #928374
# red
color1 #cc241d
color9 #fb4934
# green
color2 #98971a
color10 #b8bb26
# yellow
color3 #d79921
color11 #fabd2f
# blue
color4 #458588
color12 #83a598
# magenta
color5 #b16286
color13 #d3869b
# cyan
color6 #689d6a
color14 #8ec07c
# white
color7 #a89984
color15 #ebdbb2

# Tab bar (only shows with more than one tab)
active_tab_foreground #282828
active_tab_background #d65d0e
inactive_tab_foreground #a89984
inactive_tab_background #3c3836
tab_bar_background #1d2021
