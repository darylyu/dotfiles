# /etc/systemd/logind.conf.d/lid.conf
# Closing the lid on battery sleeps, then hibernates after a while (see sleep-hibernate.conf),
# so a laptop left closed doesn't run flat. Plugged in, it only locks the screen.
# With an external screen attached it does nothing (systemd's default).
# xfce4-power-manager has to leave the lid to logind; i3_config sets that.

[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=lock
