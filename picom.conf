# picom compositor config, used by i3 (sway doesn't need it).
# Written for picom 9 (Debian 12). See `man picom`.

backend = "glx";
vsync = true;
# Hand fullscreen windows (games, video) straight to the screen for speed.
unredir-if-possible = true;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.4;
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
    "class_g = 'i3-frame'"
];

# Short fades when windows open and close
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
no-fading-openclose = false;

# Slightly dim windows that don't have focus
inactive-dim = 0.1;
focus-exclude = [
    "window_type = 'dock'",
    "class_g = 'Rofi'"
];

# Rounded corners
corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
    # A fully maximized window or a single window in a screen won't use rounded corners
    "widthb >= 1900 && heightb >= 1000"
];

# Don't draw effects on menus and tooltips
wintypes:
{
    tooltip = { shadow = false; fade = true; };
    popup_menu = { shadow = false; };
    dropdown_menu = { shadow = false; };
    dnd = { shadow = false; };
};
