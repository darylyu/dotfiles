# volumeicon, the volume icon in the i3 tray.
# Left-click: slider. Middle-click: mute. Scroll: change volume.
# The volume keys are bound in i3_config, so volumeicon's own hotkeys and pop-ups are off.

[Alsa]
card=default
logarithmic_scale=false

[Notification]
show_notification=false
notification_type=0

[StatusIcon]
stepsize=5
onclick=pavucontrol
theme=White Gnome
use_panel_specific_icons=false
reverse_scroll_direction=false
lmb_slider=true
mmb_mute=true
use_horizontal_slider=false
show_sound_level=false
use_transparent_background=false

[Hotkeys]
up_enabled=false
down_enabled=false
mute_enabled=false
up=XF86AudioRaiseVolume
down=XF86AudioLowerVolume
mute=XF86AudioMute
